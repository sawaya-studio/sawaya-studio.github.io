<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sawaya studio</title>

<meta property="og:description" content="ここに、検索結果と SNS に出る一行を書く。">

<style>
/*
  sawaya studio。
  ==========================================================================
  **この頁は、何かを言葉で説明しない。**

  だから地は何も主張しない。無彩色の紙と、1 本の罫だけ。
  代わりに、**棚に並ぶ札そのものが、その道具の顔**になっている。

  **札の組み方は 1 つだけ。**

      うしろ … その道具の「地」。見ただけでどの道具か分かるもの
      まんなか … その道具のロゴ

    recaday の札 …… 7:00 の空と流れる雲、まんなかにワードマーク
    テロップの札 …… 方眼紙、まんなかに看板

  地も字も、その道具の中で使っている値をそのまま持ってきている
  （空は skyTable.ts の 7:00、方眼と緑とオレンジは道具の ui/public/index.html）。

  **アプリの画面は持ちこまないこと。** 行や札やボタンを並べると、
  ここが小さな取扱説明になってしまう。見せたいのは中身ではなく、顔のほう。
*/
:root{
  --paper:#faf9f7;
  --card:#ffffff;
  --ink:#1a1a1a;
  --sub:#6a6a6a;
  --faint:#8f8f8f;
  --line:#e4e2dd;
  --radius:14px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",
       "Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

/* 看板の書体。**道具に入っているものと同じ 1 本**を、使う字だけに絞って置いてある */
@font-face{
  font-family:"Telop Logo";
  src:url("./assets/fonts/851Gkktt-logo.woff2") format("woff2");
  font-display:swap;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--ui);
  font-size:16px;
  line-height:1.95;
  letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
}

/* **すべて真ん中にそろえる。** 置いてあるものが少ない頁なので、
   左に寄せると右側だけが大きく空いて、余白が余りに見える */
main{max-width:560px;margin:0 auto;padding:0 20px 88px;text-align:center}
section{margin-top:clamp(34px,6vw,64px)}

h1{font-size:clamp(24px,5vw,36px);line-height:1.5;font-weight:800;
   letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
h2{font-size:clamp(17px,2.6vw,21px);line-height:1.6;font-weight:800;
   letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0 0 4px}
p{margin:0 auto 16px;max-width:46ch}
p:last-child{margin-bottom:0}
a{color:var(--ink)}
strong{font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:34px 0}

/* 名乗り。**大きくしない。**「誰か」より「何を作ったか」を先に見せる。
   **大文字に変換しないこと。** 名前は全部小さい字（sawaya studio）で、
   ここで uppercase を掛けると SAWAYA STUDIO になってしまう */
.top{padding:clamp(40px,9vw,84px) 0 0}
.mark{font-family:var(--mono);font-size:11.5px;font-weight:600;
      letter-spacing:.22em;color:var(--faint);margin:0 0 14px}

/* 節の名前。**両側に罫を引いて、真ん中に置く** */
.eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 18px;
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint)}
.eyebrow::before,
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

.note{font-size:12.5px;line-height:1.85;color:var(--sub)}

/* ============================================================
   棚。**札そのものが、その道具の顔。**
   ============================================================ */
/* **1 行につき 1 枚を、縦に並べる。** 横に 2 枚置くと、どちらも小さくなって
   「その道具の顔」ではなく「小さな絵」になる。
   幅いっぱいまで伸ばさないのは、**大きすぎると顔ではなく背景になる**から */
.shelf{list-style:none;margin:0 auto;padding:0;display:grid;
  gap:clamp(22px,4vw,38px);max-width:400px}

.shelf li{position:relative}

/* 顔の入る枠。**角丸と影だけがこちらの持ちもので、中身は道具のもの**。
   **正方形。** recaday のワードマークは、もともとインスタの投稿（正方形）に
   合わせて焼いてあるので、この枠なら「短辺の 52%」がそのまま効く */
.face{
  position:relative;
  aspect-ratio:1/1;
  container-type:size;
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(26,26,26,.05);
  transition:transform .16s ease, box-shadow .16s ease;
}
.shelf li:hover .face{transform:translateY(-2px);box-shadow:0 10px 26px rgba(26,26,26,.13)}
.shelf li:has(a:focus-visible) .face{outline:2px solid var(--ink);outline-offset:3px}

/* 札の下の名前。**顔の中には字を置かない**ので、名前はここに出る。
   名前と、走る場所を縦に積んで、札の真ん中に置く */
.shelf .name{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  margin:13px 0 0;
}
.shelf .name b{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.shelf .name span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap}
.shelf a{text-decoration:none;color:inherit}
.shelf a::after{content:"";position:absolute;inset:0}  /* 札のどこを押しても飛ぶ */
.shelf a:focus-visible{outline:none}

/* ---------- recaday の顔 ----------
   うしろ … 7:00 の空と、流れる雲
   まんなか … ワードマーク */

/* 地の色。**空が描けない環境でも、ここが残る**（skyTable.ts の 7:00 の 3 色） */
.face--recaday{
  background:linear-gradient(to bottom,#5D8197 0%,#7097AD 52%,#CAC4A8 100%);
}
/* 空そのもの。**closed-test の頁と同じもの**（/assets/sky.js が描く）。
   縞で真似ていたことがあるが、**縞は雲にならない。** */
.face--recaday canvas{
  position:absolute;inset:0;
  width:100%;height:100%;display:block;
}
/* ワードマーク。**投稿とまったく同じ大きさ**（短辺の 52%）。
   53.9 は、焼いた 1 枚が光学中心へ寄せるぶんの余白を左右に持っているぶん
   （52 × 1.036）。ロゴのインク幅で 52% になる。

   置く高さも投稿と同じ。**ぴったり中央より少し上**にする。
   真ん中に置くと、下に沈んで見える。 */
.face--recaday .lockup{
  position:absolute;
  top:47%;left:50%;
  transform:translate(-50%,-50%);
  width:53.9cqmin;
  height:auto;
  filter:drop-shadow(0 0.2cqmin 0.6cqmin rgba(0,0,0,.28));
}

/* ---------- テロップスタジオの顔 ----------
   うしろ … 方眼紙
   まんなか … 看板

   方眼も緑もオレンジも、道具の ui/public/index.html と同じ値。 */
.face--telop{
  background-color:#fbf4e4;
  background-image:
    linear-gradient(#eee5cf 1px,transparent 1px),
    linear-gradient(90deg,#eee5cf 1px,transparent 1px);
  background-size:32px 32px;
}
/* 看板。緑の箱に白い字、オレンジのぼかさない影、黒の縁。

   **太らせない。** ゴチカクットは1ウェイトしか無いので、900 を求めると
   ブラウザが勝手に太らせて、角と隙間が潰れる。900 は書体が読めなかったとき用。

   **余白と角丸と影は、文字サイズに対する比で持つ。**
   道具の側（16px のとき padding 1px 11px / 角丸 8px / 影 3px）と同じ比。
   px で置くと、札の大きさが変わったときだけ看板の比率が崩れる。

   **overflow:hidden を掛けないこと。** この書体は字のインクが送り幅より
   わずかに外へ出るので、最後の一字（「オ」）が切り落とされる。 */
.face--telop .brand{
  /* 置き方は recaday のワードマークとそろえる。**ぴったり中央より少し上**。
     真ん中に置くと、下に沈んで見える。

     そのうえで、**影の半分だけ左上へ戻す。**
     影は右下へずらした面を 1 枚置くだけのものなので、枠のまんなかに
     箱を置くと、影のぶん重心が右下へ寄って見える。 */
  position:absolute;
  top:47%;left:50%;
  transform:translate(calc(-50% - 0.095em), calc(-50% - 0.095em));
  font-family:"Telop Logo",var(--ui);font-weight:900;font-synthesis-weight:none;
  font-size:7.5cqh;line-height:1.4;
  color:#fff;background:#2fa45f;
  border:2px solid #16211b;
  border-radius:0.5em;
  padding:0.06em 0.7em 0.1em;
  box-shadow:0.19em 0.19em 0 #f2913c;
  white-space:nowrap;
}

/* ---------- 顔を持たない道具 ---------- */
.face--plain{
  background:var(--card);
  display:grid;place-items:center;
}
.face--plain i{
  display:block;width:26cqh;height:26cqh;border-radius:6px;
  background:var(--tint,var(--line));
}

/* ---------- 連絡先 ---------- */
/* **真ん中に 1 列。** 2 列の表にすると、中央そろえの中でここだけ左右に散る */
.links{list-style:none;margin:0 auto;padding:0;display:grid;gap:10px;max-width:400px}
.links li{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px}
.links b{font-family:var(--mono);font-weight:600;color:var(--faint);
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}

.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0;padding:0;list-style:none}
.chips li{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;
  background:#fff;border:1px solid var(--line);color:var(--sub)}

footer{border-top:1px solid var(--line);margin-top:clamp(44px,8vw,88px);
  padding:20px 20px 40px;font-size:12px;color:var(--faint)}
.footin{max-width:560px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 14px;
  align-items:center;justify-content:center;text-align:center}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>
<main>
<section class="top">
<p class="mark">sawaya studio</p>
<h1>ここに、いちばん言いたい一行。</h1>
</section>
<section id="works">
<ul class="shelf">
  <li>
    <div class="face face--recaday" aria-hidden="true"><canvas data-sky></canvas><img class="lockup" src="./assets/recaday-lockup.png" width="1658" height="536" alt=""></div>
    <div class="name"><b><a href="./recaday/">recaday</a></b><span>iOS / Android</span></div>
  </li>
  <li>
    <div class="face face--telop" aria-hidden="true"><div class="brand">テロップスタジオ</div></div>
    <div class="name"><b><a href="./telop-studio/">テロップスタジオ</a></b><span>Android → iOS → PC</span></div>
  </li>
</ul>
</section>
<section id="contact">
<p class="eyebrow">連絡先</p>
<ul class="links">
  <li><b>GitHub</b><span><a href="https://github.com/SawayaWorks" target="_blank" rel="noopener">https://github.com/SawayaWorks</a></span></li>
</ul>
</section>
</main>
<footer>
  <div class="footin">
<span>sawaya studio</span>
<span>ここに、ひとこと</span>
  </div>
</footer>
<script src="./assets/clouds.js" defer></script>
<script src="./assets/sky.js" defer></script>
<script>
/* sawaya studio の頁は、いまのところ動くところが無い。
   見た目が決まって、動かしたいものが出てきたらここに書く。 */
</script>
</body>
</html>
