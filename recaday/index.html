<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recaday</title>
<meta name="description" content="準備中です。">
<meta property="og:title" content="recaday">
<meta property="og:description" content="準備中です。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sawaya-studio.github.io/recaday/">
<meta property="og:image" content="https://sawaya-studio.github.io/assets/recaday-lockup.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../assets/recaday-icon.png">
<link rel="apple-touch-icon" href="../assets/recaday-icon.png">
<link rel="canonical" href="https://sawaya-studio.github.io/recaday/">

<link rel="stylesheet" href="../assets/recaday.css">


</head>
<body>


<script src="../assets/clouds.js" defer></script>
<canvas id="sky" aria-hidden="true"></canvas>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <!-- 2色: 明るさだけ残して、暗部→中間→明部に 3 色を置く（src/filters.ts の bold と同じ考え方） -->
    <filter id="duotone-bold" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.05 1.00 0.92"/>
        <feFuncG type="table" tableValues="0.15 0.42 1.00"/>
        <feFuncB type="table" tableValues="0.00 0.00 0.28"/>
      </feComponentTransfer>
    </filter>
    <!-- 2値: しきい値 0.46 のあたりで白と黒に分ける -->
    <filter id="binary" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 0 0 0 0.06 0.94 1 1 1 1 1"/>
        <feFuncG type="table" tableValues="0 0 0 0 0.06 0.94 1 1 1 1 1"/>
        <feFuncB type="table" tableValues="0 0 0 0 0.06 0.94 1 1 1 1 1"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>

<main>
<section class="standby">
  <img class="lockup" src="../assets/recaday-lockup.png" width="1658" height="536" alt="recaday — record a day">
<p>準備中</p>
<!-- youtube: site.json の accounts.recaday に行き先がありません -->
<a class="social social--instagram" href="https://www.instagram.com/recaday_app/" target="_blank" rel="noopener">Instagram</a>
</section>
</main>

<script src="../assets/sky.js" defer></script>
<script src="../assets/recaday.js" defer></script>

</body>
</html>
