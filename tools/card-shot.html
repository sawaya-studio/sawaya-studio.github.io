<!doctype html>
<html><head><meta charset="utf-8"><title>card</title>
<style>
  html,body{margin:0;padding:0;background:#888}
  /* **札とまったく同じ大きさで置く。** ここを撮る */
  #card{position:absolute;left:0;top:0;width:1200px;height:630px;overflow:hidden}
  #sky{position:absolute;inset:0;width:1200px;height:630px;display:block}
  #mark{
    position:absolute;top:50%;left:50%;
    /* 字は絵の中で右へ 1.66% 寄っているので、そのぶん戻す */
    transform:translate(-51.66%,-50%);
    width:624px;height:auto;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.28));
  }
</style></head>
<body>
<div id="card">
  <canvas id="sky" width="1200" height="630" aria-hidden="true"></canvas>
  <img id="mark" src="/assets/recaday-lockup.png" width="1658" height="536" alt="">
</div>
<script src="/assets/clouds.js"></script>
<script src="/assets/sky.js"></script>
</body></html>
